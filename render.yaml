services:
  # ---------------------------------------------------------------------------
  # LearnWise Backend API (FastAPI)
  # ---------------------------------------------------------------------------
  - type: web
    name: learnwise-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PROJECT_NAME
        value: LearnWise
      - key: API_V1_STR
        value: /api/v1
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: DATABASE_URL
        value: postgresql://learnwise_user:8Btl4Cy4uWJbhdzZhsOhjoRbNbfeFwhG@dpg-dc20sq49v7es73bv1n00-a/learnwise_kecp
      - key: FIRST_SUPERUSER_EMAIL
        value: admin@learnwise.edu
      - key: FIRST_SUPERUSER_PASSWORD
        value: Admin@LearnWise2026

  # ---------------------------------------------------------------------------
  # LearnWise Frontend (React + Vite SPA)
  # ---------------------------------------------------------------------------
  - type: web
    name: learnwise-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: learnwise-backend
          property: host
          format: https://{host}/api/v1
